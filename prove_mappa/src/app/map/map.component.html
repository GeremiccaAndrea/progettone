<div>
   <!-- Sezione per la mappa fullscreen -->
   <div id="map" class="container-fluid" ></div>

  
   <!-- Bottone '+' in basso a destra -->
   <!--<button class="btn btn-primary btn-add" (click)="toReport()">+</button>-->

   <!-- Contenitore del Dropdown per il pulsante "+" -->
<div class="dropdown d-inline-block"> <!-- Usa d-inline-block per mantenere il flusso se necessario -->

  <!-- Il pulsante "+" ora funge da trigger per il dropdown -->
  <button class="btn btn-primary btn-add dropdown-toggle" type="button" id="addMenuButton" data-bs-toggle="dropdown" >
    +
  </button>

  <!-- Lista delle opzioni che appaiono al click -->
  <ul class="dropdown-menu" aria-labelledby="addMenuButton">
    <li>
      <!-- Opzione 1: Esegue l'azione originale toReport() -->
      <a class="dropdown-item" (click)="toReport()">Crea Report</a>
      <!-- Alternativa con <button>:
      <button class="dropdown-item" type="button" (click)="toReport()">Crea Report</button>
      -->
    </li>
    <li>
      <li>
        <!-- Questo link ora APRE il modal, non contiene più la tabella -->
        <a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#crimeTableModal" > Mostra Tabella Crimini </a>
      </li>
  </ul>
  <div class="modal fade" id="crimeTableModal" tabindex="-1" aria-labelledby="crimeTableModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg"> <!-- modal-lg rende il modal più largo, opzionale -->
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="crimeTableModalLabel">Tabella dei Crimini</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Qui mettiamo il contenuto che prima era dentro <details> -->
          <div class="container-fluid"> <!-- Usa container-fluid per adattarsi al modal -->
            <div class="tabella">
              <!-- Rimosso <h2> perché c'è già il titolo nel modal-header -->
              <table class="table table-bordered table-striped"> <!-- Aggiunto table-striped per leggibilità -->
                <thead>
                  <tr>
                    <th>Data</th>
                    <th>Arresto</th>
                    <th>Tipologia</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Assicurati che 'crimini' sia disponibile nello scope del componente -->
                  <tr *ngFor="let crimine of crimini">
                    <td>{{ crimine.data }}</td>
                    <td>{{ crimine.arresto }}</td>
                    <td>{{ crimine.tipologia }}</td>
                  </tr>
                  <!-- Messaggio se non ci sono crimini (opzionale) -->
                  <tr *ngIf="!crimini || crimini.length === 0">
                    <td colspan="3" class="text-center">Nessun dato disponibile.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
          <!-- Puoi aggiungere altri bottoni qui se necessario -->
        </div>
      </div>
    </div>
  </div>
</div>
   
   <!-- Switch in basso a sinistra -->
   <div class="switch-container">
     <div class="form-check form-switch" >
       <input class="form-check-input" type="checkbox" id="flexSwitchCheckDefault" (change)="onSwitchChange($event)">
       <label class="form-check-label" for="flexSwitchCheckDefault" >Switch</label>
     </div>
   </div>
   
   <!-- Script Bootstrap e Leaflet.js -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
